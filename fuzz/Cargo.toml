[package]
name = "par-term-emu-core-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Own workspace root: the parent repo's workspace excludes this crate, and an
# explicit (empty) table here makes that independence unconditional — the
# sanitizer-instrumented build must never unify features with the library.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
parking_lot = "0.12.5"

[dependencies.par-term-emu-core-rust]
path = ".."
default-features = false
features = ["rust-only", "mux"]

# rust-only: no Python toolchain in the fuzzer — see docs/fable/ENH-014-parser-fuzz-targets.md.
# The targets mirror the untrusted-byte entry points: the whole VTE pipeline,
# the Sixel state machine, the Kitty APC parser, the tmux control parser, and
# (ENH-018, +mux) the par-mux control-protocol command and hook-report grammars.

[[bin]]
name = "terminal_process"
path = "fuzz_targets/terminal_process.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sixel"
path = "fuzz_targets/sixel.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apc_filter"
path = "fuzz_targets/apc_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kitty"
path = "fuzz_targets/kitty.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tmux_control"
path = "fuzz_targets/tmux_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mux_parse_command"
path = "fuzz_targets/mux_parse_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mux_hook_report"
path = "fuzz_targets/mux_hook_report.rs"
test = false
doc = false
bench = false
