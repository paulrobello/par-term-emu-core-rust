name: Fuzz

# Coverage-guided fuzzing of the untrusted-byte parsers (ENH-014, +apc_filter
# in ENH-020, +the par-mux control-line and hook-report parsers in ARC-121, +the attach stdin tokenizer in ENH-046). Manual-dispatch like every other workflow in this repo, plus a
# nightly schedule — the cron keeps looking when nobody remembers to.
# -rss_limit_mb=512 (ENH-020): memory blowups count as failures.
# quarantine_size_mb=64 (default 256): freed-memory quarantine otherwise fills
# toward its own 256MB budget and pushes RSS past the limit on long runs even
# when live heap stays ~30MB (measured 2026-10-09: kitty OOMed at 519MB with
# 28MB live, ~200MB quarantined); -malloc_limit_mb=256 keeps the single-
# allocation bomb tripwire tighter than the RSS ceiling.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [terminal_process, sixel, kitty, apc_filter, tmux_control, mux_parse_command, mux_hook_report, attach_input]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }} (10 min bounded)
        env:
          ASAN_OPTIONS: "detect_odr_violation=0:quarantine_size_mb=64:malloc_context_size=10"
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=512 -malloc_limit_mb=256

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
