name: Fuzz

# Coverage-guided fuzzing of the untrusted-byte parsers (ENH-014, +apc_filter
# in ENH-020, +the par-mux control-line and hook-report parsers in ARC-121). Manual-dispatch like every other workflow in this repo, plus a
# nightly schedule — the cron keeps looking when nobody remembers to.
# -rss_limit_mb=512 (ENH-020): memory blowups count as failures.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [terminal_process, sixel, kitty, apc_filter, tmux_control, mux_parse_command, mux_hook_report]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }} (10 min bounded)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=512

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
