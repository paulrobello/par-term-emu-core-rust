name: CI

# ARC-004: pull requests run the cheap gates (version check, lint, FFI
# drift) and single-OS Rust/Python test + mux legs. The full OS x Python
# matrix, Windows mux, wheels, feature matrix, web_term/ drift, and the
# xcframework stay manual (workflow_dispatch) for runner cost.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Version sanity check - runs before all builds
  version-check:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check version consistency
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          PYTHON_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          INIT_VERSION=$(grep '^__version__' python/par_term_emu_core_rust/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "pyproject.toml version: $PYTHON_VERSION"
          echo "__init__.py version: $INIT_VERSION"

          ERRORS=""

          if [ "$CARGO_VERSION" != "$PYTHON_VERSION" ]; then
            ERRORS="${ERRORS}ERROR: Version mismatch between Cargo.toml ($CARGO_VERSION) and pyproject.toml ($PYTHON_VERSION)\n"
          fi

          if [ "$CARGO_VERSION" != "$INIT_VERSION" ]; then
            ERRORS="${ERRORS}ERROR: Version mismatch between Cargo.toml ($CARGO_VERSION) and __init__.py ($INIT_VERSION)\n"
          fi

          if [ -n "$ERRORS" ]; then
            echo -e "$ERRORS"
            exit 1
          fi

          echo "✅ All versions match: $CARGO_VERSION"

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    # windows-latest legs exceed 15m: uv sync + maturin build + 3 cargo-test
    # feature-set compiles run 15-25m cold; the 15m ceiling killed them
    # mid-compile (runs 36314822395, 36315904423, 36597353943).
    timeout-minutes: 30
    needs: [version-check]
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.14"]') || fromJSON('["3.12", "3.13", "3.14"]') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable

    - name: Install uv
      run: pip install uv

    - name: Create virtual environment and sync dependencies
      run: uv venv .venv && uv sync --all-extras

    - name: Install maturin in virtual environment
      run: uv pip install maturin

    - name: Build Python package
      run: uv run maturin develop --release --locked

    - name: Check Python stub ships and parses (ARC-002)
      run: |
        uv run python -c "import par_term_emu_core_rust"
        uv run pyright python/par_term_emu_core_rust/_native.pyi

    - name: Run Rust tests
      run: cargo test --locked --lib --no-default-features --features pyo3/auto-initialize,ffi

    - name: Run Rust streaming tests
      run: cargo test --locked --no-default-features --features pyo3/auto-initialize,streaming,ffi

    - name: Run python_bindings unit tests (python-test)
      run: cargo test --locked --lib --no-default-features --features python-test

    # The --ignore entries are the only CI guard for the PTY test family:
    # since QA-111 removed the module-level skips, these files run in every
    # local `make test`/`make test-pty`, but GitHub runners hang on PTY I/O.
    # Do not remove the ignores without first proving they pass on runners.
    - name: Run Python tests (Linux)
      if: runner.os == 'Linux'
      run: timeout 300 uv run pytest tests/ -v --timeout=5 --timeout-method=thread --ignore=tests/test_pty.py --ignore=tests/test_ioctl_size.py --ignore=tests/test_pty_resize_sigwinch.py --ignore=tests/test_nested_shell_resize.py --ignore=tests/test_pty_screenshot.py

    - name: Run Python tests (macOS)
      if: runner.os == 'macOS'
      run: uv run pytest tests/ -v --timeout=5 --timeout-method=thread --ignore=tests/test_pty.py --ignore=tests/test_ioctl_size.py --ignore=tests/test_pty_resize_sigwinch.py --ignore=tests/test_nested_shell_resize.py --ignore=tests/test_pty_screenshot.py

    - name: Run Python tests (Windows)
      if: runner.os == 'Windows'
      run: uv run pytest tests/ -v --timeout=5 --timeout-method=thread --ignore=tests/test_pty.py --ignore=tests/test_ioctl_size.py --ignore=tests/test_pty_resize_sigwinch.py --ignore=tests/test_nested_shell_resize.py --ignore=tests/test_pty_screenshot.py

  # Phase 1 exit criteria (par-mux.md): mux tests on all three platforms, and
  # the D1 isolation guarantee — `sim` must never pull tokio or portable-pty.
  mux-test:
    name: Mux tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [version-check]
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable

    - name: Install cargo-nextest
      # Plain cargo install keeps the third-party action set unchanged;
      # the mux-test job is the only nextest consumer (QA-185).
      run: cargo install cargo-nextest --locked

    - name: Build sim (D1 isolation)
      # Default shell (PowerShell on Windows): cargo links with MSVC's
      # link.exe here, as the Test job proves. Under shell: bash, git-bash's
      # coreutils link.exe in PATH shadows MSVC's and every build script
      # fails to link.
      run: cargo build --locked --no-default-features --features sim

    - name: Assert sim pulls no runtime/auth/proto deps (D1)
      shell: bash
      # cargo tree resolves without linking, so the git-bash PATH is harmless.
      run: |
        if cargo tree --locked --no-default-features --features sim -e normal | grep -qE 'tokio|portable-pty|subtle|zeroize|prost|axum|swash'; then
          echo "D1 violation: sim pulled tokio, portable-pty, subtle, zeroize, prost, axum, or swash"
          exit 1
        fi

    - name: Run mux tests (lib + e2e + daemon + reattach + attach client)
      # nextest with the ci profile (.config/nextest.toml): the profile
      # keeps the suite serial — the PTY spawns contend under parallel test
      # threads, card 01a0c64fc43e7913b474c038db0635d5 — and bounds every
      # test, 30s slow mark and killed at 4x (QA-185), where the plain
      # cargo-test run hung until the job's own timeout ceiling.
      # `attach` rides here (not in the mux-bin closure): without it the
      # attach module — client lib tests and the mux_attach PTY suite —
      # compiles nowhere in CI (the horizontal-divider regression shipped
      # through every green gate that way).
      run: cargo nextest run --profile ci --locked --no-default-features --features rust-only,mux-bin,serde,attach

    - name: Run mux-backed streaming tests (MuxSessionFactory)
      # The only run with streaming and mux together; without it these
      # tests would compile under lint's clippy and never execute. The ci
      # profile keeps the serial execution --test-threads=1 gave.
      run: cargo nextest run --profile ci --locked --lib --no-default-features --features rust-only,streaming,mux,serde streaming::mux_factory

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version-check]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install uv
      run: pip install uv

    - name: Create virtual environment and sync dev dependencies
      run: uv venv .venv && uv sync --group dev

    - name: Check Rust formatting
      run: cargo fmt -- --check

    - name: Run Rust clippy
      # `attach` rides too: the attach module compiles only under its
      # feature, and clippy is CI's only pass over it.
      run: cargo clippy --locked --all-targets --features python,streaming,mux,mux-bin,serde,streaming-bin,ffi,attach -- -D warnings

    - name: Check Python formatting
      run: uv run ruff format --check .

    - name: Run Python linting
      run: uv run ruff check .

    - name: Run Python type checking
      run: uv run pyright .

    - name: Install lychee
      # Plain cargo install keeps the third-party action set unchanged,
      # same policy as cargo-nextest.
      run: cargo install lychee --locked

    - name: Check doc links and anchors (ENH-035)
      # Must match the local `make doc-links-check` flags and globs.
      run: lychee --offline --include-fragments --no-progress docs/*.md README.md CONTRIBUTING.md QUICKSTART.md CHANGELOG.md CLAUDE.md

  build:
    name: Build wheels
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [version-check]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    - name: Install maturin
      run: pip install maturin

    - name: Build wheels
      run: maturin build --release --locked

    - name: Upload wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wheels-${{ matrix.os }}
        path: target/wheels/

  # ARC-001: the committed web_term/ static export must match a fresh build
  # of web-terminal-frontend/. Release packaging (deployment.yml) ships the
  # committed tree, so a stale export silently ships outdated frontend code.
  # Determinism precondition: next.config.js pins generateBuildId (random
  # default build IDs made rebuilds of identical source differ).
  web-term-drift:
    name: web_term/ drift gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-check]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - name: Install frontend dependencies
      working-directory: web-terminal-frontend
      run: bun install --frozen-lockfile

    - name: Rebuild static export
      run: make web-build-static
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Fail if web_term/ is stale
      run: |
        git add -A web_term/
        if ! git diff --cached --exit-code -- web_term/; then
          echo ""
          echo "ERROR: committed web_term/ does not match a fresh build of web-terminal-frontend/."
          echo "The static export is stale or was built from different frontend sources."
          echo "Fix: run 'make web-build-static' from the repo root and commit the updated web_term/."
          exit 1
        fi
        echo "web_term/ is in sync with the frontend sources."

  # ENH-019: every feature must build on its own, and heavy dependencies must
  # stay out of the slim profiles (rust-only/sim/mux/streaming). Catches the
  # ARC-043 class (screenshot = [] leaving swash unconditional) and the
  # ARC-044 class (mux pulling binary-only clap) mechanically.
  features:
    name: Feature matrix
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [version-check]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable

    - name: Install cargo-hack
      run: cargo install cargo-hack --locked

    # ARC-107: the make targets below call cargo without --locked; a locked
    # fetch fails first if Cargo.lock is stale against Cargo.toml.
    - name: Assert Cargo.lock is current
      run: cargo fetch --locked

    - name: Run feature matrix and dependency assertions
      run: make check-features

  # ARC-104: the checkall FFI drift gates. include/terminal_core.h must be
  # exactly what cbindgen generates from src/ffi.rs, and every exported fn
  # must appear in the header and docs/FFI_GUIDE.md.
  ffi-drift:
    name: FFI header + surface drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version-check]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable

    - name: Install cbindgen
      # Pinned: the check diffs generated output, and cbindgen's formatting
      # varies by version. 0.29.4 generated the committed header.
      run: cargo install cbindgen --version 0.29.4 --locked

    - name: Assert Cargo.lock is current
      run: cargo fetch --locked

    - name: Check FFI header and surface
      run: make ffi-header-check ffi-surface-check

  # ARC-104: the iOS xcframework (C FFI for on-device embedders). Release
  # builds also produce it in deployment.yml's ios-xcframework job; this
  # catches a broken staticlib, header smoke-compile, or link probe before a
  # release is cut. No upload: the artifact ships only from deployment.yml.
  xcframework:
    name: iOS xcframework build
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    needs: [version-check]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        targets: aarch64-apple-ios,aarch64-apple-ios-sim

    - name: Assert Cargo.lock is current
      run: cargo fetch --locked

    - name: Build TerminalCore.xcframework
      run: make xcframework
