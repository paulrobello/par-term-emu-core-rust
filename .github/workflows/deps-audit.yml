# ENH-040: weekly dependency audit across all three ecosystems (Rust, web
# frontend, Python) — the same target devs run locally: `make audit-deps`.
# Triggers stay dispatch/schedule only (D1); never on push or PR.
name: deps-audit

on:
  schedule:
    # Mondays 07:23 UTC — off the hour, not colliding with bench.yml (09:17).
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: make audit-deps
        run: make audit-deps
