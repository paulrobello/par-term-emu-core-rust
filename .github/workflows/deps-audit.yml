# ENH-040: weekly dependency audit across all three ecosystems (Rust, web
# frontend, Python) — the same target devs run locally: `make audit-deps`.
# Triggers stay dispatch/schedule only (D1); never on push or PR.
name: deps-audit

on:
  schedule:
    # Mondays 07:23 UTC — off the hour, not colliding with bench.yml (09:17).
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: make audit-deps
        run: make audit-deps
