# ENH-040: weekly dependency audit across all three ecosystems (Rust, web
# frontend, Python) — the same target devs run locally: `make audit-deps`.
# Triggers stay dispatch/schedule only (D1); never on push or PR.
name: deps-audit

on:
  schedule:
    # Mondays 07:23 UTC — off the hour, not colliding with bench.yml (09:17).
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: make audit-deps
        run: make audit-deps
