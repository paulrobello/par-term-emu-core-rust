# ENH-040: weekly dependency audit across all three ecosystems (Rust, web
# frontend, Python) — the same target devs run locally: `make audit-deps`.
# Triggers stay dispatch/schedule only (D1); never on push or PR.
name: deps-audit

on:
  schedule:
    # Mondays 07:23 UTC — off the hour, not colliding with bench.yml (09:17).
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: make audit-deps
        run: make audit-deps
