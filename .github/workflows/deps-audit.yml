# ENH-040: weekly dependency audit across all three ecosystems (Rust, web
# frontend, Python) — the same target devs run locally: `make audit-deps`.
# Triggers stay dispatch/schedule only (D1); never on push or PR.
name: deps-audit

on:
  schedule:
    # Mondays 07:23 UTC — off the hour, not colliding with bench.yml (09:17).
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: make audit-deps
        run: make audit-deps
