name: Build and Deploy

# This workflow handles the complete release process:
# 1. Builds standalone streaming server binaries for multiple platforms
# 2. Builds Python wheels for Linux, macOS, and Windows (Python 3.12, 3.13, 3.14)
# 3. Creates a GitHub release with all artifacts (wheels + binaries)
# 4. Publishes the Rust library to crates.io (source code)
# 5. Publishes Python wheels to PyPI
#
# To trigger: Go to Actions → Build and Deploy → Run workflow
# Ensure Cargo.toml and pyproject.toml versions are synchronized before running

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Version sanity check - runs before all builds
  version-check:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check version consistency
        id: check
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          PYTHON_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          INIT_VERSION=$(grep '^__version__' python/par_term_emu_core_rust/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "pyproject.toml version: $PYTHON_VERSION"
          echo "__init__.py version: $INIT_VERSION"

          ERRORS=""

          if [ "$CARGO_VERSION" != "$PYTHON_VERSION" ]; then
            ERRORS="${ERRORS}ERROR: Version mismatch between Cargo.toml ($CARGO_VERSION) and pyproject.toml ($PYTHON_VERSION)\n"
          fi

          if [ "$CARGO_VERSION" != "$INIT_VERSION" ]; then
            ERRORS="${ERRORS}ERROR: Version mismatch between Cargo.toml ($CARGO_VERSION) and __init__.py ($INIT_VERSION)\n"
          fi

          if [ -n "$ERRORS" ]; then
            echo -e "$ERRORS"
            exit 1
          fi

          echo "✅ All versions match: $CARGO_VERSION"
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  # Publish to crates.io (after GitHub release)
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Two member index waits (up to 10 min each) ride ahead of the root publish.
    timeout-minutes: 45
    needs: [github-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Verify version consistency
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          PYTHON_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "pyproject.toml version: $PYTHON_VERSION"

          if [ "$CARGO_VERSION" != "$PYTHON_VERSION" ]; then
            echo "ERROR: Version mismatch between Cargo.toml ($CARGO_VERSION) and pyproject.toml ($PYTHON_VERSION)"
            exit 1
          fi

          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Rust tests
        # Root `cargo test` runs only the root package; the members' unit tests
        # run explicitly. par-mux's library code sits behind `mux` (with no
        # features `--lib` compiles zero tests), so it runs with `mux`.
        run: |
          cargo test --locked --lib --no-default-features
          cargo test --locked -p par-term-emu-core --lib --no-default-features
          cargo test --locked -p par-mux --lib --no-default-features --features mux

      - name: Publish derive sub-crate (par-term-emu-derive)
        # Must be published before the main crate: crates.io strips `path`
        # and resolves the dependency from the registry, so the main crate's
        # `par-term-emu-derive = { path = "derive", version = "0.43.0" }` can
        # only resolve once this sub-crate exists on crates.io. Workspace
        # publish order (crates/par-term-emu-core/DESIGN.md): derive →
        # par-term-emu-core → par-mux → root (member steps below). Idempotent —
        # a re-run after the first publish no-ops (version already exists).
        run: cargo publish --manifest-path derive/Cargo.toml --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "par-term-emu-derive already published, continuing..."
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish workspace member par-term-emu-core
        # Workspace publish order (crates/par-term-emu-core/DESIGN.md "Version
        # train"): derive -> par-term-emu-core -> par-mux -> root. The root pins
        # this member with `=X.Y.Z` and crates.io strips `path`, so the member
        # must be resolvable from the sparse index before par-mux or the root
        # publishes. A failure here fails the job (no continue-on-error): a
        # missing core would otherwise surface later as a confusing resolution
        # error in the root publish.
        run: |
          CRATE=par-term-emu-core
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r --arg n "$CRATE" '.packages[] | select(.name == $n) | .version')
          echo "$CRATE version: $VERSION"
          if curl -fsS -o /dev/null -A "par-term-emu-core-rust-ci (github.com/paulrobello/par-term-emu-core-rust)" "https://crates.io/api/v1/crates/$CRATE/$VERSION"; then
            echo "::notice::$CRATE $VERSION already on crates.io"
          else
            cargo publish -p "$CRATE" --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

          # Wait for the sparse index (what cargo resolves against) to list the
          # version: up to 10 minutes.
          for i in $(seq 1 60); do
            INDEX=$(curl -fsS -A "par-term-emu-core-rust-ci (github.com/paulrobello/par-term-emu-core-rust)" "https://index.crates.io/pa/r-/$CRATE" || true)
            if [[ "$INDEX" == *"\"vers\":\"$VERSION\""* ]]; then
              echo "Index propagation confirmed for $CRATE $VERSION"
              exit 0
            fi
            echo "Waiting for $CRATE $VERSION in the index ($i/60)..."
            sleep 10
          done
          echo "::error::$CRATE $VERSION not in the crates.io index after 10 minutes"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish workspace member par-mux
        # Depends on par-term-emu-core `=X.Y.Z` (resolvable after the step
        # above); the root pins par-mux `=X.Y.Z`, so it publishes before the root.
        run: |
          CRATE=par-mux
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r --arg n "$CRATE" '.packages[] | select(.name == $n) | .version')
          echo "$CRATE version: $VERSION"
          if curl -fsS -o /dev/null -A "par-term-emu-core-rust-ci (github.com/paulrobello/par-term-emu-core-rust)" "https://crates.io/api/v1/crates/$CRATE/$VERSION"; then
            echo "::notice::$CRATE $VERSION already on crates.io"
          else
            cargo publish -p "$CRATE" --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

          for i in $(seq 1 60); do
            INDEX=$(curl -fsS -A "par-term-emu-core-rust-ci (github.com/paulrobello/par-term-emu-core-rust)" "https://index.crates.io/pa/r-/$CRATE" || true)
            if [[ "$INDEX" == *"\"vers\":\"$VERSION\""* ]]; then
              echo "Index propagation confirmed for $CRATE $VERSION"
              exit 0
            fi
            echo "Waiting for $CRATE $VERSION in the index ($i/60)..."
            sleep 10
          done
          echo "::error::$CRATE $VERSION not in the crates.io index after 10 minutes"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry run publish
        # --no-verify: this crate is a PyO3 cdylib (Python extension) whose
        # default-feature build can't resolve libpython symbols standalone, so
        # the publish-time verification link fails. The crate is already
        # verified via `make dev` (maturin) + the full test suite.
        run: cargo publish --dry-run --no-verify

      - name: Publish to crates.io
        run: cargo publish --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Version may already exist on crates.io, continuing..."
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # 0.4.0
        with:
          args: 'Published {{ EVENT_PAYLOAD.repository.name }} to crates.io successfully!'
        continue-on-error: true

  # Build streaming server binaries for multiple platforms
  build-streaming-binaries:
    name: Build streaming binary - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: par-term-streamer
            asset_name: par-term-streamer-linux-x86_64

          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: par-term-streamer
            asset_name: par-term-streamer-linux-aarch64

          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: par-term-streamer
            asset_name: par-term-streamer-macos-x86_64

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: par-term-streamer
            asset_name: par-term-streamer-macos-aarch64

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: par-term-streamer.exe
            asset_name: par-term-streamer-windows-x86_64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build streaming server binary
        run: cargo build --locked --release --bin par-term-streamer --no-default-features --features streaming-bin --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          else
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          fi

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p release-binaries
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-binaries/${{ matrix.asset_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: release-binaries/${{ matrix.asset_name }}
          retention-days: 1

  # Standalone par-mux daemon binaries (`-p par-mux`, features `mux-bin,attach`):
  # no Python, no par-term/streaming dependency — the multiplexer alone.
  # Linux ARM64 builds natively on ubuntu-24.04-arm (no cross linker); macOS
  # x86_64 cross-compiles from the ARM runner (not smoke-run — Rosetta is not
  # assumed). Archives are packaged by scripts/package_mux_release.py with a
  # per-target sha256 file; the github-release job merges them into one
  # par-mux-v<version>-SHA256SUMS.txt.
  build-mux-binaries:
    name: Build par-mux binary - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: false

          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: true

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build par-mux binary
        # ARC-007 O2 Phase 2: the binary lives in the par-mux member.
        run: cargo build --locked --release -p par-mux --features mux-bin,attach --bin par-mux --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/par-mux

      - name: Smoke test --version/--help (native targets)
        if: matrix.cross == false
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="target/${{ matrix.target }}/release/par-mux.exe"
          else
            BIN="target/${{ matrix.target }}/release/par-mux"
          fi
          "$BIN" --version
          "$BIN" --help > /dev/null
          echo "smoke OK: $BIN"

      - name: Package release archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="target/${{ matrix.target }}/release/par-mux.exe"
            PY=python
          else
            BIN="target/${{ matrix.target }}/release/par-mux"
            PY=python3
          fi
          "$PY" scripts/package_mux_release.py \
            --bin "$BIN" \
            --version "${{ needs.version-check.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --output-dir mux-release

      - name: Upload mux archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mux-binaries-${{ matrix.target }}
          path: mux-release/*
          retention-days: 1

  # iOS xcframework for the C FFI (ParDeck on-device embedding). Built from
  # the headless rust-only profile — the default python feature links the
  # host libpython and cannot produce an iOS artifact.
  ios-xcframework:
    name: Build iOS xcframework
    runs-on: macos-latest
    timeout-minutes: 40
    needs: [version-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # ARC-107: `make xcframework` calls cargo without --locked; a locked
      # fetch fails first if Cargo.lock is stale against Cargo.toml.
      - name: Assert Cargo.lock is current
        run: cargo fetch --locked

      - name: Build TerminalCore.xcframework
        run: make xcframework

      - name: Zip xcframework
        run: |
          cd target/xcframework
          zip -qry TerminalCore.xcframework.zip TerminalCore.xcframework

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcframework
          path: target/xcframework/TerminalCore.xcframework.zip
          retention-days: 1

  # Linux builds
  linux:
    name: Linux ${{ matrix.target }} - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [version-check]
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Set up QEMU
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python${{ matrix.python-version }}
          sccache: 'true'
          manylinux: auto

      - name: Create virtual environment (x86_64 only)
        if: matrix.target == 'x86_64'
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install --find-links dist par-term-emu-core-rust

      - name: Install test dependencies (x86_64 only)
        if: matrix.target == 'x86_64'
        run: |
          source .venv/bin/activate
          uv pip install pytest pytest-timeout pytest-asyncio

      - name: Run tests (x86_64 only)
        if: matrix.target == 'x86_64'
        run: |
          source .venv/bin/activate
          timeout 300 pytest tests/ -v --timeout=5 --timeout-method=thread --ignore=tests/test_pty.py --ignore=tests/test_ioctl_size.py --ignore=tests/test_pty_resize_sigwinch.py --ignore=tests/test_nested_shell_resize.py

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  # macOS builds
  macos:
    name: macOS - Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [version-check]
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # maturin-action only runs `rustup target add` against the runner's
      # preinstalled toolchain, which can be older than this crate's MSRV —
      # install current stable explicitly so the MSRV check passes.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Build wheels - x86_64
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64
          args: --release --locked --out dist --interpreter python${{ matrix.python-version }}
          sccache: 'true'
      - name: Build wheels - universal2
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: universal2-apple-darwin
          args: --release --locked --out dist --interpreter python${{ matrix.python-version }}
          sccache: 'true'
      - name: Create virtual environment
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install --find-links dist par-term-emu-core-rust
      - name: Install test dependencies
        run: |
          source .venv/bin/activate
          uv pip install pytest pytest-timeout pytest-asyncio
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --timeout=5 --timeout-method=thread --ignore=tests/test_pty.py --ignore=tests/test_ioctl_size.py --ignore=tests/test_pty_resize_sigwinch.py --ignore=tests/test_nested_shell_resize.py
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: dist

  # Windows builds
  windows:
    name: Windows - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [version-check]
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64
          args: --release --locked --out dist --interpreter python${{ matrix.python-version }}
          sccache: 'true'

      - name: Create virtual environment
        run: |
          uv venv .venv
          .venv\Scripts\activate
          uv pip install --find-links dist par-term-emu-core-rust

      - name: Install test dependencies
        run: |
          .venv\Scripts\activate
          uv pip install pytest pytest-timeout pytest-asyncio

      - name: Run tests (skip PTY tests on Windows)
        run: |
          .venv\Scripts\activate
          pytest tests/ -v --timeout=30 --timeout-method=thread -k "not pty"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist

  # Source distribution
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  # Package web terminal frontend
  package-web-frontend:
    name: Package web terminal frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: get_version
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Verify web_term directory exists
        run: |
          if [ ! -d "web_term" ]; then
            echo "ERROR: web_term directory not found"
            exit 1
          fi
          ls -la web_term/

      - name: Create web frontend archive
        run: |
          mkdir -p release-web
          cd web_term
          tar -czf ../release-web/par-term-web-frontend-v${{ steps.get_version.outputs.version }}.tar.gz .
          cd ..
          cd web_term
          zip -r ../release-web/par-term-web-frontend-v${{ steps.get_version.outputs.version }}.zip .
          cd ..
          # Checksum sidecar verified by `par-term-streamer --download-frontend` (SEC-203)
          cd release-web
          sha256sum par-term-web-frontend-v${{ steps.get_version.outputs.version }}.tar.gz > par-term-web-frontend-v${{ steps.get_version.outputs.version }}.tar.gz.sha256
          cd ..

      - name: Verify archives
        run: |
          ls -lh release-web/
          tar -tzf release-web/par-term-web-frontend-v${{ steps.get_version.outputs.version }}.tar.gz | head -20
          unzip -l release-web/par-term-web-frontend-v${{ steps.get_version.outputs.version }}.zip | head -20

      - name: Upload web frontend artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-frontend
          path: release-web/*
          retention-days: 1

  # Create GitHub release (before crates.io and PyPI)
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-streaming-binaries, build-mux-binaries, linux, macos, windows, sdist, package-web-frontend, ios-xcframework]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Get version
        id: get_version
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Download Python wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download streaming server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: Download par-mux archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mux-binaries-*
          path: mux-release
          merge-multiple: true

      - name: Download web frontend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-frontend
          path: web-frontend

      - name: Download iOS xcframework
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-xcframework
          path: xcframework

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.get_version.outputs.version }}"

          # Check if release exists
          if gh release view "$VERSION" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Deleting and recreating..."
            gh release delete "$VERSION" --repo '${{ github.repository }}' --yes
          fi

          # Create new release
          gh release create \
          "$VERSION" \
          --repo '${{ github.repository }}' \
          --generate-notes \
          --latest

      - name: Upload Python wheels to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
          'v${{ steps.get_version.outputs.version }}' dist/** \
          --repo '${{ github.repository }}' \
          --clobber

      - name: Upload streaming server binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
          'v${{ steps.get_version.outputs.version }}' binaries/* \
          --repo '${{ github.repository }}' \
          --clobber

      - name: Upload par-mux binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Merge the per-target checksum files into the release-level SUMS.
          cat mux-release/*.sha256 > par-mux-v${{ steps.get_version.outputs.version }}-SHA256SUMS.txt
          gh release upload \
          'v${{ steps.get_version.outputs.version }}' mux-release/*.tar.gz mux-release/*.zip \
          par-mux-v${{ steps.get_version.outputs.version }}-SHA256SUMS.txt \
          --repo '${{ github.repository }}' \
          --clobber

      - name: Upload web frontend to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
          'v${{ steps.get_version.outputs.version }}' web-frontend/* \
          --repo '${{ github.repository }}' \
          --clobber

      - name: Upload iOS xcframework to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
          'v${{ steps.get_version.outputs.version }}' xcframework/TerminalCore.xcframework.zip \
          --repo '${{ github.repository }}' \
          --clobber

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # 0.4.0
        with:
          args: 'A new release v${{ steps.get_version.outputs.version }} has been created for {{ EVENT_PAYLOAD.repository.full_name }}.'
        continue-on-error: true

  # Publish to PyPI
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [github-release]
    environment:
      name: pypi
      url: https://pypi.org/p/par-term-emu-core-rust
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Get version
        id: get_version
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # 0.4.0
        with:
          args: 'The project {{ EVENT_PAYLOAD.repository.full_name }} v${{ steps.get_version.outputs.version }} has been published to PyPI.'
        continue-on-error: true
