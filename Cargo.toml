[workspace]
members = [".", "derive", "crates/par-term-emu-core", "crates/par-mux"]
# The cargo-fuzz crate is deliberately outside the workspace: its sanitizer
# instrumented builds must not share feature unification or target dirs with
# the library or derive crates.
exclude = ["fuzz"]

[package]
name = "par-term-emu-core-rust"
version = "0.58.1"
edition = "2021"
rust-version = "1.98"
authors = ["Paul Robello <probello@gmail.com>"]
description = "Comprehensive terminal emulator library in Rust with Python bindings - VT100/VT220/VT320/VT420/VT520 support, PTY, Sixel/iTerm2/Kitty graphics"
readme = "README.md"
license = "MIT"
repository = "https://github.com/paulrobello/par-term-emu-core-rust"
homepage = "https://github.com/paulrobello/par-term-emu-core-rust"
documentation = "https://github.com/paulrobello/par-term-emu-core-rust/blob/main/README.md"
keywords = ["terminal", "emulator", "vt100", "pty", "sixel"]
categories = ["command-line-utilities", "development-tools", "api-bindings"]
exclude = [
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.svg",
    "*.sixel",
    "*.html",
    "*.yaml",
    "images/",
    "examples/",
    "tests/",
    "web-terminal-frontend/",
    "web_term/",
    "fuzz/",
    "terminfo/",
    "shell_integration/",
    ".github/",
    ".gitignore",
    "CLAUDE.md",
    "handoff.md",
    "streaming.md",
    "Makefile",
    "pyproject.toml",
    "python/",
    "scripts/",
]

[lib]
name = "par_term_emu_core_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "par-term-streamer"
path = "src/bin/streaming_server/main.rs"
required-features = ["streaming-bin"]

[dependencies]
log = "0.4"
pyo3 = { version = "0.29", optional = true, features = ["multiple-pymethods"] }
# Proc-macro helpers (#[pyo3_get_all]) for the Python data classes (ARC-014).
par-term-emu-derive = { path = "derive", version = "0.47.0", optional = true }
# The terminal core (ARC-007 O2): every pre-split public path is re-exported
# from src/lib.rs. Exact pin + lockstep version — see
# crates/par-term-emu-core/DESIGN.md "Version train" (`make core-version-check`).
par-term-emu-core = { path = "crates/par-term-emu-core", version = "=0.58.1" }
# The par-mux multiplexer (ARC-007 O2 Phase 2), re-exported as `crate::mux`
# behind the `mux` feature. Same exact pin + lockstep version as the core.
par-mux = { path = "crates/par-mux", version = "=0.58.1", optional = true }
portable-pty = { version = "0.9.0", optional = true }
base64 = "0.22.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

# Streaming server dependencies
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
axum = { version = "0.8.9", features = ["ws"], optional = true }
tower-http = { version = "0.6.11", features = ["fs", "trace", "cors"], optional = true }
futures-util = { version = "0.3.32", optional = true }

# Cross-platform local socket for the streaming server's MuxSessionFactory
# (src/streaming/mux_factory.rs), which dials the par-mux daemon socket.
interprocess = { version = "2.4.2", optional = true }

# CLI dependencies (for streaming server binary)
clap = { version = "4.6.1", features = ["derive", "env"], optional = true }

anyhow = { version = "1.0.102", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }

# HTTP client for downloading web frontend (using rustls for cross-compilation support)
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"], optional = true }

# Compression (used for Kitty graphics o=z zlib decompression + archive extraction)
flate2 = "1.1.9"

# Archive extraction
tar = { version = "0.4.46", optional = true }
# SHA-256 verification of the downloaded web frontend archive (SEC-203)
sha2 = { version = "0.11.0", optional = true }

# Protocol Buffers
prost = { version = "0.14.3", optional = true }

# TLS support
# (PEM parsing uses rustls-pki-types' PemObject trait via tokio_rustls::rustls::pki_types,
#  replacing the unmaintained rustls-pemfile crate — RUSTSEC-2025-0134.)
rustls = { version = "0.23.40", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
axum-server = { version = "0.8.0", features = ["tls-rustls"], optional = true }

# HTTP Basic Auth support (htpasswd-format verification via maintained crates;
# replaces the abandoned htpasswd-verify chain — RUSTSEC-2022-0011 / -0004 / -0071.)
bcrypt = { version = "0.19.1", optional = true }
md-5 = { version = "0.11.0", optional = true }
sha1 = { version = "0.11.0", optional = true }
headers = { version = "0.4.1", optional = true }

# System resource monitoring
sysinfo = { version = "0.39.3", optional = true }

# Screenshot support - using pure Rust swash for cross-platform compatibility
image = { version = "0.25.10", default-features = false, features = ["bmp", "ff", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "color_quant"] }
# Decoder exclusions (SEC-007 / ARC-007): AVIF is intentionally excluded — it
# pulls in `ravif` → `rav1e` → the unmaintained `paste` proc-macro
# (RUSTSEC-2024-0436). EXR is excluded for the same reason (exr → pulp →
# paste). HDR and DDS are dropped as implausible terminal payloads. None of
# these formats are ever produced by this crate (screenshots are PNG/JPEG/BMP;
# inline graphics decode PNG/JPEG/GIF/WebP/TIFF/etc.), so the exclusions have
# no behavior impact and `paste` is never compiled. It still appears in
# Cargo.lock, and `cargo audit` still reports it, because the `rayon` feature
# above declares the weak deps `ravif?/threading` and `exr?/rayon`, and cargo
# records weakly referenced optional deps in the lockfile (SEC-134). This crate
# calls no `image` rayon API. SEC-134 resolution: the `rayon` feature is now
# dropped, so `paste`, `pulp`, `rav1e`, `exr` and `ravif` are gone from
# Cargo.lock entirely and `cargo audit` is clean.
parking_lot = "0.12.5"
# Streaming-only: constant-time credential compares and zeroizing drops
# (src/streaming/config.rs, auth paths). Optional so headless profiles
# (sim/rust-only/mux) pull neither.
subtle = { version = "2.6.1", optional = true }
zeroize = { version = "1.8.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
nix = { version = "0.31.3", features = ["process", "term", "signal", "poll"], optional = true }

# jemalloc for better server performance (5-15% throughput improvement)
# Only available on non-Windows platforms
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true }

[build-dependencies]
# Only needed for regenerating protobuf code (requires protoc installed)
prost-build = { version = "0.14.3", optional = true }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
tokio = { version = "1.52.3", features = ["full", "test-util"] }
tempfile = "3.27"
# axum already depends on tower/util; as a dev-dep it only adds ServiceExt
# (.oneshot) for the in-process router tests in src/streaming/server.rs.
tower = { version = "0.5", features = ["util"] }

# Benchmark harness for the VTE processing hot path (ENH-007). Still compiles
# (and is cached) as part of test builds, but the bench target below is skipped
# unless `rust-only` is enabled, so checkall never runs benchmarks.
criterion = { version = "0.7", features = ["html_reports"] }

# VTE throughput benchmarks (ENH-007). `required-features` keeps the target out
# of everyday `cargo test` runs; run via `make bench`
# (cargo bench --no-default-features --features rust-only).
[[bench]]
name = "terminal_throughput"
harness = false
required-features = ["rust-only"]

# FFI per-frame dirty-readback cost (ParDeck RQ2) — same gating as above,
# plus the `ffi` feature that compiles the C surface (ARC-112).
[[bench]]
name = "ffi_readback"
harness = false
required-features = ["rust-only", "ffi"]

# The FFI dirty-range zero-allocation gate (ENH-026) links the C surface.
[[test]]
name = "ffi_dirty_ranges_alloc"
required-features = ["ffi"]

[[bench]]
name = "pty_geometry"
harness = false
required-features = ["pty_session"]

[features]
default = ["python"]
python = ["pyo3", "pyo3/extension-module", "par-term-emu-derive", "par-term-emu-core/python", "pty_session", "screenshot", "macro-yaml"]
# The `python` feature's deps WITHOUT pyo3/extension-module, so the bindings
# (and their #[cfg(test)] unit tests) link a real interpreter in `cargo test`.
# maturin needs no knowledge of this: pyproject's [tool.maturin] features add
# pyo3/extension-module to wheel builds independently.
python-test = ["pyo3", "pyo3/auto-initialize", "par-term-emu-derive", "par-term-emu-core/python", "pty_session", "screenshot", "macro-yaml"]

# Terminal-to-image screenshot renderer (embedded fonts + swash/image deps).
# Enabled by `python`/`full`. The `sim` profile has excluded it since 0.54.0
# (ARC-021 created the gate; ARC-043 made it actually gate the dep).
screenshot = ["par-term-emu-core/screenshot"]

# Real PTY backend (PtySession/PtyTerminal): portable-pty + Unix signal deps.
# Enabled by `python` (PyPtyTerminal binding) and `streaming-bin` (the server
# binary spawns real shells). Headless `sim` consumers omit it to stay
# PTY-free — they vendor the Terminal as a pure screen model with no process.
pty_session = ["par-term-emu-core/pty_session", "portable-pty", "nix"]
# Library streaming: WebSocket/protobuf server for embedders. Excludes the
# binary-only deps (clap/anyhow/tracing/reqwest/tar) — see `streaming-bin`.
streaming = ["par-term-emu-derive", "tokio", "tokio-tungstenite", "axum", "tower-http", "futures-util", "prost", "rustls", "tokio-rustls", "axum-server", "bcrypt", "md-5", "sha1", "headers", "sysinfo", "subtle", "zeroize"]

# Standalone `par-term-streamer` binary only (ARC-015): CLI/logging/download
# deps the library streaming module never uses. Depends on `streaming`.
streaming-bin = ["streaming", "clap", "anyhow", "tracing", "tracing-subscriber", "reqwest", "tar", "sha2", "pty_session", "macro-yaml"]

# Terminal multiplexer (par-mux): the `par-mux` workspace member, re-exported
# as `crate::mux` (ARC-007 O2 Phase 2). Needs real PTYs and a local socket, so
# it is deliberately absent from `default` and `sim` — see par-mux.md D1.
# `interprocess` stays for the streaming server's MuxSessionFactory.
mux = ["dep:par-mux", "par-mux/mux", "par-term-emu-core/mux", "pty_session", "interprocess", "serde"]

# Forwards to the member's daemon-binary feature. The `par-mux` binary itself
# now builds from the member (`cargo build -p par-mux --features mux-bin`);
# library embedders (par-term) still never compile clap (ARC-106).
mux-bin = ["mux", "par-mux/mux-bin"]

# The `par-mux attach` client (`crate::mux::attach`), forwarded to the member.
attach = ["mux-bin", "par-mux/attach"]

# `Macro::{save_yaml, load_yaml, to_yaml, from_yaml}` (ARC-116). Enabled by
# `python`/`python-test` (the Python `Macro` YAML methods) and `streaming-bin`
# (`--macro-file` playback); `dep:` is safe because nothing names
# serde_yaml_ng's implicit feature.
macro-yaml = ["par-term-emu-core/macro-yaml"]

# Serde derives on the replay-snapshot types (TerminalSnapshot/GridSnapshot and
# their leaves) — the on-disk format for par-mux Phase 3 persistence (par-mux.md
# D3.1). serde itself is already a required dependency, so this feature only
# gates whether the derives are compiled in; the smallvec/bitflags serde
# integrations are pulled in only while this feature is enabled.
serde = ["par-term-emu-core/serde", "par-mux?/serde"]

# jemalloc for better server performance (5-15% throughput improvement)
# Automatically included with streaming on non-Windows platforms
jemalloc = ["tikv-jemallocator"]

# Regenerate protobuf code from proto/terminal.proto (requires protoc installed)
regenerate-proto = ["prost-build"]

# C ABI surface (`ptec_terminal_*` exports, src/ffi.rs) for the xcframework and
# C/Swift embedders; off in Python wheels so they export no unprefixed C
# symbols (ARC-112). Build with `--features rust-only,ffi`.
ffi = ["par-term-emu-core/ffi"]

# Convenience feature combinations
rust-only = []
# Headless simulation profile: grid + terminal + screenshot only. Excludes the
# real-PTY backend, Python bindings, and streaming server, so a pure-Rust
# embedder (e.g. par-hack's server-side screen model) can vendor the crate with
# `default-features = false, features = ["sim"]` and pull in neither portable-pty
# nor the PyO3/streaming dep trees. graphics/sixel stay compiled because the
# Terminal and the screenshot renderer depend on them intrinsically.
# Intentionally an empty feature list: `sim` enables nothing itself — it only
# names the profile, and src/lib.rs rejects combining it with `python`.
# Since 0.54.0 it no longer implies `screenshot` (ENH-024): embedders that
# render images opt in with `features = ["sim", "screenshot"]`.
sim = []
full = ["python", "streaming", "streaming-bin"]

# cargo-fuzz builds the library with `--cfg fuzzing` (the ENH-020 apc_filter
# entry point); declare the cfg so those builds stay warning-clean.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
