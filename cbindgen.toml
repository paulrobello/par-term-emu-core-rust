# ENH-027 — generate include/terminal_core.h from the Rust source of truth.
#
# Regenerate with `make ffi-header` after changing any #[repr(C)] type or
# extern "C" fn in src/ffi.rs / src/keyboard.rs; `make ffi-header-check`
# (wired into checkall) fails when the committed header is stale.
#
# The TERM_* constants and the _Static_assert layout pins are NOT generated:
# cbindgen cannot express them. They live in include/terminal_core_layout.h
# (pulled in by the trailer below) and are pinned to the Rust values by the
# layout_header_defines_match_rust test in src/ffi.rs — renumber either side
# and that test fails.
#
# The `header` text below is the header's contract prose (ownership,
# threading, panic, ABI version). Edit it HERE, run `make ffi-header`, and
# commit — never edit the generated .h directly.
language = "C"
include_guard = "PAR_TERM_EMU_CORE_TERMINAL_CORE_H"
style = "type"
cpp_compat = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

header = """
/*
 * terminal_core.h — C API for embedding the par-term emulator core.
 *
 * GENERATED by cbindgen from src/ffi.rs (ENH-027); do not edit — regenerate
 * with `make ffi-header`. The TERM_* constants and _Static_assert layout
 * pins live in terminal_core_layout.h, included at the end of this file.
 *
 * Ownership contract:
 * - ptec_terminal_get_state returns a heap-allocated SharedState owned by the
 *   caller; release it with ptec_terminal_free_state. Its `title`, `cwd`, and
 *   `cells` pointers are valid only until that call.
 * - The vtable (including its user_data) must stay valid for the lifetime
 *   of the observer registration.
 *
 * Cross-cutting contract notes (DOC-071):
 * - Reads target the ACTIVE grid: while the alternate screen is active,
 *   ptec_terminal_scrollback_count returns 0 — the alternate screen has no
 *   scrollback.
 * - Handles are single-threaded: no concurrent calls on one Terminal.
 * - No entry point catches a panic. A panic inside any call aborts the
 *   host process (Rust 1.81+ abort-on-FFI-unwind semantics, ARC-087).
 * - Allocation failure aborts the process; this surface has no error
 *   channel, so out-of-memory is fatal by design.
 *
 * ABI version (ARC-063): TERM_CORE_ABI_VERSION (terminal_core_layout.h) is
 * the contract version of this header. A binary compares it against
 * ptec_terminal_abi_version() at runtime to detect a layout mismatch; bump the
 * macro and the Rust constant together on any layout or contract change.
 */
"""

trailer = """
#include "terminal_core_layout.h"
"""

[export]
# constants excluded on purpose: the TERM_* surface lives in
# terminal_core_layout.h (pinned by a Rust test), and exporting constants
# here would sweep in unrelated pub consts from across the crate.
item_types = ["structs", "opaque", "typedefs", "functions"]
include = [
    "SharedCell",
    "SharedState",
    "TerminalObserverVtable",
    "TermRowRange",
    "TermCursorState",
    "TermModeState",
    "TermKeyEvent",
    "KeyEncodeOptions",
    "TermEvent",
    "term_event_cb",
    "term_event_v2_cb",
]

[export.rename]
# The FFI mirror carries the Term* family name (ENH-028 plan); the Rust
# side keeps the encoding-scoped KeyEncodeOptions name.
KeyEncodeOptions = "TermKeyOptions"

[parse]
parse_deps = false
