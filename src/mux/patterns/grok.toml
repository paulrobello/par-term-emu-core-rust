# par-mux agent scrape patterns — grok (Grok Build).
#
# Pattern data ported from herdr (https://github.com/ogulcancelik/herdr,
# Apache License 2.0), upstream manifest version 2026.09.18.1
# (updated_at 2026-09-18). Ported 2026-09-22.
#
# Omissions vs upstream, with reasons:
#   - osc_progress_working / osc_progress_idle: the emulator core parses
#     OSC 9;4 into ProgressState and does not retain the raw payload the
#     rules match on. Title and content rules retain working/idle coverage
#     (the upstream comment notes OSC progress only "covers titles that
#     omit it").
# All upstream regions used by the retained rules (osc_title, whole_recent,
# bottom_non_empty_lines) are implemented, so no remaps.
#
# Upstream evidence notes, kept because they explain the rule shapes:
# Grok emits OSC 0 titles by default. Idle is "grok" or "<session> - grok".
# During a turn the configured title gains a braille spinner and activity
# text. Permission prompts add "⚠ Action Required"; that prefix blinks
# while the terminal is unfocused, so visible blocker rules outrank the
# title spinner rule. Working turns render one live status line directly
# above the prompt box ("⠧ Waiting on subagent… 2.8s   13s ⇣29.7k [stop]")
# with a braille spinner and a trailing [stop] chip, plus an Esc:cancel
# footer hint; idle footers end with "Ctrl+.:shortcuts" and never contain
# "Esc:cancel". The startup splash draws its logo with braille characters,
# so working rules anchor on the [stop] chip, not on a bare spinner glyph.
#
# Licensed under the Apache License, Version 2.0 as pattern data derived
# from herdr; see herdr's LICENSE file for the license text.
id = "grok"
version = "2026.09.18.1-parmux1"
updated_at = "2026-09-18T00:00:00Z"
aliases = ["grok-build"]

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
contains = ["Action Required"]

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "whole"
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
contains = ["tab:scrollback", "shift+x:dismiss"]

# Pre-0.2.x permission UI kept for older Grok Build releases.
[[rules]]
id = "permission_scope_selector"
state = "blocked"
priority = 1180
region = "whole"
contains = ["yes, proceed", "no, reject"]
any = [
  { contains = ["use ← → to choose permission whitelist scope"] },
  { contains = ["←/→:scope"] },
]

[[rules]]
id = "background_status_working"
state = "working"
priority = 1165
region = "bottom_non_empty_lines(12)"
line_regex = ['^\s*[○◎◉]\s+[1-9][0-9]*\s+(?:commands?|monitors?|loops?|subagents?)(?:\s+·\s+[1-9][0-9]*\s+(?:commands?|monitors?|loops?|subagents?))*\s+still running(?:\s+·\s+send a message to interrupt)?\s*$']

[[rules]]
id = "spinner_status_working"
state = "working"
priority = 1160
region = "whole"
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 1155
region = "bottom_non_empty_lines(2)"
contains = ["ctrl+.:shortcuts"]
any = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]

# Pre-0.2.x working chrome kept for older Grok Build releases.
[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 1140
region = "whole"
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

# Title items are configurable; omitting "grok" does not imply activity.
# Require a spinner for the working read.
[[rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
regex = ['(?:^|\s)[\x{2801}-\x{28FF}](?:\s|$)']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "osc_title"
regex = ['(?:^| - )grok$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
]

[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(2)"
contains = ["ctrl+.:shortcuts"]
not = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]
