# QA-185: nextest profile for the Mux CI job. A test running past 30s is
# flagged slow, and terminate-after kills it at 4x that — the harness bound
# for a wedged daemon or a hung PTY spawn, where the plain `cargo test` run
# this replaces hung until the job's own timeout-minutes ceiling.
[profile.ci]
slow-timeout = { period = "30s", terminate-after = 4 }

# The suite's PTY spawns contend under parallel test threads —
# moving-target openpty failures observed locally (card
# 01a0c64fc43e7913b474c038db0635d5) — so the cargo-test run this replaces
# passed --test-threads=1; the ci profile keeps that serial execution.
override-threads = true
threads = 1

# The chords test is legitimately long, not wedged: ~123s in isolation
# (several waits consume most of their 10s deadline), which straddles the
# default 30s x4 kill. Give it 30s x8 instead of watering the harness
# bound down for every other test.
[[profile.ci.overrides]]
filter = "test(render_mode_zoom_rename_border_chords)"
slow-timeout = { period = "30s", terminate-after = 8 }
