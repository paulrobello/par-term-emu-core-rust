# par-mux agent scrape patterns — cursor (Cursor Agent CLI, `cursor-agent`).
#
# Pattern data ported from herdr (https://github.com/ogulcancelik/herdr,
# Apache License 2.0), upstream manifest version 2026.08.03.1
# (updated_at 2026-08-03), ported 2026-10-19.
#
# Omissions vs upstream, with reasons:
#   - visible_blocker/visible_working: herdr-only render markers with no
#     par-mux engine meaning.
#   - min_engine_version: herdr's catalog-compatibility key; par-mux ships
#     its patterns with the binary.
# Region remaps: whole_recent -> whole (herdr's whole_recent region is the
# whole visible screen, so the remap is exact).
#
# idle_fallback ports herdr's engine default for a known agent with no
# matching rule (DEFAULT_KNOWN_AGENT_IDLE_FALLBACK in detect/manifest.rs):
# cursor draws no idle marker, so its idle is "running, nothing matched".
# par-mux applies it only while the process table shows cursor (or
# cursor-agent) in the pane.
#
# Licensed under the Apache License, Version 2.0 as pattern data derived
# from herdr; see herdr's LICENSE file for the license text.
id = "cursor"
version = "2026.08.03.1-parmux2"
updated_at = "2026-08-03T01:08:04Z"
aliases = ["cursor-agent"]
idle_fallback = true

[[rules]]
id = "write_file_approval"
state = "question"
priority = 320
region = "bottom_non_empty_lines(8)"
contains = ["write to this file?", "proceed (y)"]
any = [
  { contains = ["reject & propose changes"] },
  { contains = ["esc or n or p"] },
  { contains = ["add write("] },
]

# Upstream region: whole_recent.
[[rules]]
id = "approval_prompt"
state = "question"
priority = 300
region = "whole"
any = [
  { contains = ["waiting for approval", "run this command?"], any = [{ contains = ["run (once) (y)"] }, { contains = ["skip (esc or n)"] }] },
  { contains = ["(y) (enter)"] },
  { line_regex = ['(?i)^\s*allow .*\(y\)'] },
  { contains = ["keep (n)"] },
  { contains = ["skip (esc or n)"] },
  { line_regex = ['(?i)^\s*(?:→\s*)?run .*\(y\)'] },
]

[[rules]]
id = "stop_hint_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(6)"
contains = ["ctrl+c to stop"]

[[rules]]
id = "background_task_status_working"
state = "working"
priority = 95
region = "bottom_non_empty_lines(5)"
line_regex = ['(?i)\b[1-9][0-9]*\s+background\s+tasks?\b']

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(8)"
line_regex = ['^\s*(⬡|⬢|[⠀-⣿]+)\s+\p{Alphabetic}+\w*ing\b']
