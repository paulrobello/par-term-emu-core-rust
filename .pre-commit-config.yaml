# Pre-commit hooks for par-term-emu
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # web_term/ is generated build output; CI verifies it byte-matches a fresh build
        exclude: ^(tests/.*\.expected|.*\.snap|web_term/.*)$
      - id: end-of-file-fixer
        exclude: ^(tests/.*\.expected|.*\.snap|web_term/.*)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Rust formatting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code with rustfmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

  # Rust linting
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with clippy
        entry: cargo clippy --all-targets --features python,streaming,mux,mux-bin,serde,streaming-bin,ffi,attach -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy-core
        name: cargo clippy (par-term-emu-core)
        description: Lint the terminal core member (ARC-007 O2)
        entry: cargo clippy -p par-term-emu-core --all-targets --features screenshot,pty_session,serde,macro-yaml,mux,ffi,python -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy-par-mux
        name: cargo clippy (par-mux)
        description: Lint the par-mux member (ARC-007 O2 Phase 2)
        entry: cargo clippy -p par-mux --all-targets --features mux-bin -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy-par-mux-attach
        name: cargo clippy (par-mux attach)
        description: Lint the par-mux attach client, matching CI's mux-bin,attach run
        entry: cargo clippy -p par-mux --all-targets --features mux-bin,attach -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # Rust tests
  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test
        description: Run Rust tests
        entry: cargo test --lib --no-default-features --features pyo3/auto-initialize,ffi
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test-core
        name: cargo test (par-term-emu-core)
        description: Run the terminal core member's unit tests (ARC-007 O2)
        entry: cargo test -p par-term-emu-core --lib --features ffi
        language: system
        types: [rust]
        pass_filenames: false

  # Python formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-format
        name: ruff format
        description: Format Python code with ruff

  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff check
        description: Lint Python code with ruff
        args: [--fix]

  # Python type checking with pyright
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        description: Type check Python code with pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

  # Python tests are NOT run in pre-commit: the `maturin develop` rebuild made
  # every Rust-touching commit take minutes, and the resulting machine load
  # flaked the streaming suite's latency-sensitive timeouts. make checkall is
  # the authoritative test gate (run before every push).
